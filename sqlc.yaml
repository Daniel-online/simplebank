version: "2"
sql:
  - schema: "db/migration"
    queries: "db/query"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "db/sqlc"
        sql_package: "pgx/v5" # Ou "database/sql" se estiver usando a biblioteca padrão do Go
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
